name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the package
        run: npm run check
      - name: Run the tests
        run: npm test
      - name: Build the package
        run: npm run build
